# ─── Netlify Config — Garagem do MEEC (React App) ──────────────
# Build the Vite React app in the client/ directory

[build]
  publish = "client/dist"
  command = "cd client && npm install && npm run build"

[dev]
  framework = "#static"

[build.processing]
  skip_processing = true

[build.ignore]
  patterns = ["node_modules/*", "src/*", "data/*", "*.js", "server.js"]

# ─── Redirects ──────────────────────────────────────────────────
# SPA: all non-file routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ─── Headers ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── Media files from root (/media/*) ────────────────────────────
[[redirects]]
  from = "/media/*"
  to = "/media/:splat"
  status = 200
  force = false
