# ─── Netlify Config — Garagem do MEEC ───────────────────────────
# Static site deployment. The Express backend was replaced with
# direct API calls to the CRM (crm-garagem on Railway).

[build]
  publish = "."

[dev]
  framework = "#static"

[build.processing]
  skip_processing = true

# ─── Redirects ──────────────────────────────────────────────────
# SPA: all non-file routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ─── Headers ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
